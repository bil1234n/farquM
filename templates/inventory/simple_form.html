{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <form method="post" enctype="multipart/form-data" novalidate>
      {% csrf_token %}
      <div class="card">
        <div class="card-header">{{ title }}</div>
        <div class="card-body">
          {% include "partials/form_fields.html" with form=form wide_fields="description,notes,address" %}
        </div>
        <div class="card-footer bg-light d-flex justify-content-between">
          <a href="{{ cancel_url }}" class="btn btn-outline-secondary btn-sm">Cancel</a>
          <button class="btn btn-primary btn-sm"><i class="bi bi-check-lg me-1"></i> Save</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
