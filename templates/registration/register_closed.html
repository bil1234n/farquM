{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registration closed &middot; {{ BUSINESS_NAME }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'css/app.css' %}" rel="stylesheet">
</head>
<body>
<div class="login-wrap">
  <div class="login-card text-center">
    <i class="bi bi-lock display-5 text-muted"></i>
    <h1 class="h5 fw-semibold mt-3 mb-2">Registration is closed</h1>
    <p class="text-muted small mb-4">
      Self-registration is switched off for this system. Ask an administrator
      to create an account for you.
    </p>
    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i> Go to sign in
    </a>
  </div>
</div>
</body>
</html>
