{% load core_extras %}
<div class="col-lg-{{ col|default:5 }}">
  <div class="card h-100">
    <div class="card-header d-flex justify-content-between align-items-center">
      <span class="text-danger"><i class="bi bi-exclamation-triangle me-1"></i>
        {% if profile == 'counter' %}My Late Borrowers{% else %}Overdue Debts{% endif %}</span>
      <a href="{% url 'credit:debt_list' %}?status=OVERDUE" class="btn btn-sm btn-outline-danger">View all</a>
    </div>
    <div class="table-responsive">
      <table class="table table-hover mb-0">
        <thead><tr><th>Customer</th><th class="num">Balance</th><th class="num">Late</th></tr></thead>
        <tbody>
          {% for d in overdue_debts %}
            <tr>
              <td>
                <a href="{% url 'credit:debt_detail' d.pk %}">{{ d.customer.name }}</a>
                <div class="text-muted-sm">{{ d.customer.phone }}</div>
              </td>
              <td class="num money fw-semibold">{{ d.balance|money }}</td>
              <td class="num"><span class="badge text-bg-danger">{{ d.days_overdue }}d</span></td>
            </tr>
          {% empty %}
            <tr><td colspan="3"><div class="empty-state py-4"><i class="bi bi-check-circle text-success"></i>Nothing overdue.</div></td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
