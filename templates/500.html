<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Server error</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container" style="max-width:520px;margin-top:12vh">
    <div class="card border-0 shadow-sm">
      <div class="card-body text-center p-5">
        <h1 class="h4 mb-3">Something went wrong</h1>
        <p class="text-muted small mb-4">
          The error has been logged. No data was changed &mdash; operations that fail are
          rolled back in full, so nothing is left half-written.
        </p>
        <a href="/" class="btn btn-primary btn-sm">Return to dashboard</a>
      </div>
    </div>
  </div>
</body>
</html>
